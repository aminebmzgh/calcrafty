name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Playwright + axe + no-JS
        run: npm run test:e2e
      - name: Lighthouse CI (ads off + ads on)
        run: npm run lhci
      - name: SEO validation
        run: npm run seo:validate
      - name: Keyword map
        run: npm run keywords:check
      - name: Link check
        run: npm run links:check
      - name: State page uniqueness
        run: npm run uniqueness:check
      - name: Byte budgets
        run: npm run budgets:check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 7
