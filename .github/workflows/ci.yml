name: CI

# Pushes to main run this via Deploy (quick suite), so there is no push trigger here: one run per push.
# Quick: unit, build, static checks, mobile e2e with axe on one page per type, desktop features + JS budgets.
# Full (weekly, or on demand): axe on every page in both themes, all e2e on both projects, Lighthouse ads off + on.
on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
  schedule:
    # Sundays 06:00 UTC, the day before the Monday data refresh deploy.
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.full) && 75 || 30 }}
    env:
      FULL: ${{ github.event_name == 'schedule' || inputs.full == true }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Playwright + axe + no-JS (quick)
        if: env.FULL != 'true'
        run: npm run test:e2e:quick
      - name: Playwright + axe + no-JS (full)
        if: env.FULL == 'true'
        run: npm run test:e2e
      - name: Lighthouse CI (ads off + ads on)
        if: env.FULL == 'true'
        run: npm run lhci
      - name: SEO validation
        run: npm run seo:validate
      - name: Keyword map
        run: npm run keywords:check
      - name: Link check
        run: npm run links:check
      - name: State page uniqueness
        run: npm run uniqueness:check
      - name: Byte budgets
        run: npm run budgets:check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 7
